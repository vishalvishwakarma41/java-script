<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Master real</title>
    <link rel="stylesheet" href="../TypingMS/css/style.css">
</head>

<body>

<div id="MAIN_BOX">

    <h2>Typing Master</h2>

    <div id="LAVEL_DIV">
        <label>Difficulty Level </label>
        <select id="level" onchange="loadParagraph()">
            <option value="">Select Level</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="custom">Custom Words</option>
        </select>
    </div>

    <div id="CUSTOM_INPUT" style="display:none;">
        <span>Enter Word Count :</span>
        <input type="number" id="costom_input">
        <button id="costum_btn" onclick="loadCustomWords()">Confirm</button>
    </div>

    <div id="SHOW_BOX"></div>

    <div class="cheak_div">
        <input type="checkbox" id="mutecheck" disabled>
        <span>Mute Keyboard Sounds</span>
    </div>

    <!-- <div class="type-wrapper">

        <div id="colorText"></div>
        
        <textarea
            id="typing_box"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"

            disabled
            oninput="colorWords(); startTimer()"
            onscroll="syncScroll()"
            onfocus="disableCopyPaste()"
        ></textarea>
    </div> -->
    <div class="type-wrapper">


    <div id="colorText"></div>

    <textarea
        id="typing_box"
        spellcheck="false"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        disabled
    ></textarea>

</div>


    <div id="TYMING_BOX">
        <h4 id="COUNT_TIME">00:05:00</h4>
        <div>
            <button id="PAUSE_TIMER" onclick="togglePause()" disabled>
                Pause Timer
            </button>
            <button id="RESET_TIMER" onclick="resetTimer()" disabled>
                Reset Timer
            </button>
        </div>
        <button id="SUMMID_BTN" onclick="submitTest()" disabled>
            Submit
        </button>
    </div>

    <div id="FOOTER_DIV">

        <div class="HEAD_BOX">
            <label>Correct Characters</label>
            <input type="text" id="correctCharacters" readonly>

            <label>Incorrect Characters</label>
            <input type="text" id="incorrectCharacters" readonly>

            <label>Skipped Characters</label>
            <input type="text" id="skippedCharacters" readonly>
        </div>

        <div class="MID_BOX">
            <label>Correct Words</label>
            <input type="text" id="correctWords" readonly>

            <label>Incorrect Words</label>
            <input type="text" id="incorrectWords" readonly>

            <label>Skipped Words</label>
            <input type="text" id="skippedWords" readonly>
        </div>

        <div class="FOOTER_BOX">
            <label>Total Accuracy (%)</label>
            <input type="text" id="totalAccuracy" readonly>

            <label>Words Per Minute (WPM)</label>
            <input type="text" id="wpm" readonly>
        </div>

    </div>

</div>

<audio id="keySound" src="audio.mp3"></audio>

<script src="../TypingMS/js/script.js"></script>
</body>
</html>
