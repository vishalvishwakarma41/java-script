<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Complete Example</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!--  NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">MyApp</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
      </ul>
    </div>
  </div>
</nav>

<!--  CONTAINER -->
<div class="container mt-5">

  <!-- ALERT -->
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    Welcome! Bootstrap Example Loaded Successfully.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- GRID SYSTEM -->
  <div class="row">

    <!-- LEFT CARD -->
    <div class="col-md-4 mb-4">
      <div class="card shadow">
        <img src="https://picsum.photos/300/200" class="card-img-top img-fluid">
        <div class="card-body text-center">
          <h5 class="card-title fw-bold">Card Title</h5>
          <p class="card-text">This is a Bootstrap card example.</p>
          <button class="btn btn-primary w-100">Read More</button>
        </div>
      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="col-md-4">

      <div class="card shadow p-4">

        <h3 class="mb-3 text-center text-primary">Registration Form</h3>

        <form>

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" placeholder="Enter name">
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="Enter email">
          </div>

          <div class="mb-3">
            <label class="form-label">Course</label>
            <select class="form-select">
              <option>Select Course</option>
              <option>Java</option>
              <option>Python</option>
            </select>
          </div>

          <!-- FLEX -->
          <div class="d-flex justify-content-between">
            <button type="reset" class="btn btn-outline-danger">Reset</button>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">
              Submit
            </button>
          </div>

        </form>
      </div>

    </div>
  </div>

  <!-- TABLE -->
  <div class="mt-5">
    <h4 class="text-center mb-3">Student List</h4>
    <table class="table table-bordered table-striped table-hover">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Course</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Vishal</td>
          <td>Java</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Rahul</td>
          <td>Python</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!--  MODAL -->
<div class="modal fade" id="exampleModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Form Submitted</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Your registration was successful!
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<table class="table table-bordered table-striped table-hover">
  <tr>
    <th>Name</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Vishal</td>
    <td>21</td>
  </tr>
</table>
<div class="container">
  <div class="row">
    <div class="col-6 bg-primary">50%</div>
    <div class="col-6 bg-success">50%</div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
